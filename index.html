};

function speak(text) {
  if (!("speechSynthesis" in window)) { alert("Questo telefono non riesce a leggere ad alta voce. Mostrate lo schermo."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ""));
  u.lang = "fr-FR"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => (v.lang || "").toLowerCase().startsWith("fr"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();

function myData() { return store.get("me", {}); }
function names() { const m = myData(); return [m.n1 || "Lei", m.n2 || "Lui"]; }
function contacts() {
  const m = myData(), out = [];
  if (m.guideTel) out.push({ name: "Accompagnatore Boscolo" + (m.guideName ? " (" + m.guideName + ")" : ""), tel: m.guideTel });
  [1, 2, 3].forEach(i => { if (m["c" + i + "t"]) out.push({ name: m["c" + i + "n"] || "Contatto " + i, tel: m["c" + i + "t"] }); });
  return out;
}

      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("Pharmacie Européenne, 6 place de Clichy, 75009 Paris")}" target="_blank" rel="noopener">🗺️ Apri in Google Maps</a></details>
    <details class="card"><summary>🏥 Tessera sanitaria</summary>
      <p>Portatela sempre: il retro (tessera europea TEAM) vale in Francia per le cure urgenti. Per le emergenze chiamate il 15 o il 112.</p></details>
    <details class="card"><summary>🔌 Prese e telefono</summary>
      <p>Le spine italiane piccole e quelle tonde (Schuko) funzionano. Quelle grandi a tre poli in fila no. Il roaming in Europa è incluso: telefono e internet funzionano come in Italia. Stesso fuso orario dell'Italia.</p></details>
    <details class="card"><summary>🌦️ Tempo a fine ottobre</summary>
      <p>Tra 8 e 15 °C, con possibile pioggia. Ombrello pieghevole, giacca a strati e soprattutto scarpe comode: a Parigi si cammina tanto e in metro ci sono molte scale.</p></details>
  `}),

  prima: () => {
    const st = store.get("before", {});
    return { title: "✅ Prima di partire", html: `
      <p class="muted">Spuntate le voci man mano. Restano salvate sul telefono.</p>
      ${BEFORE.map((t, i) => `<label class="check"><input type="checkbox" data-before="${i}" ${st[i] ? "checked" : ""}>${esc(t)}</label>`).join("")}
    `};
  },

  dati: () => {
    const m = myData();
    const f = (k, label, type = "text", ph = "") => `<label for="f_${k}">${label}</label><input id="f_${k}" data-me="${k}" type="${type}" value="${esc(m[k] || "")}" placeholder="${esc(ph)}" ${type === "tel" ? 'inputmode="tel"' : ""}>`;
    return { title: "👤 I miei dati", html: `
      <div class="card green">🔒 Questi dati restano <b>solo su questo telefono</b>. Non vengono inviati a nessuno. Si salvano da soli mentre scrivete.</div>
      <h2>Nomi</h2>
      <div class="row"><div>${f("n1", "Nome 1", "text", "es. Sonia")}</div><div>${f("n2", "Nome 2", "text", "es. Ivan")}</div></div>
      <h2>Accompagnatore Boscolo</h2>
      ${f("guideName", "Nome")}
      ${f("guideTel", "Telefono", "tel", "+39 ...")}
      <h2>Familiari da chiamare</h2>
      ${[1, 2, 3].map(i => `<div class="card">${f("c" + i + "n", "Nome contatto " + i)}${f("c" + i + "t", "Telefono", "tel", "+39 ...")}</div>`).join("")}
      <h2>Salute</h2>
      <label for="f_meds">Medicine che prendete (nomi e dosi)</label>
      <textarea id="f_meds" data-me="meds" placeholder="es. Lei: ... mattina e sera. Lui: ... mattina e sera">${esc(m.meds || "")}</textarea>
      <label for="f_allerg">Allergie o malattie importanti</label>
      <textarea id="f_allerg" data-me="allerg" placeholder="es. allergia alla penicillina, diabete...">${esc(m.allerg || "")}</textarea>
      <p class="muted">Questi dati compaiono nella schermata «Ho bisogno di aiuto», da mostrare in caso di emergenza.</p>
      <a class="btn solid" href="#/">✔ Fatto</a>
    `};
  }
};

/* ---------- Schermate «mostra» a tutto schermo ---------- */
function showView(parts) {
  if (parts[0] === "f") {
    const c = PHRASES[+parts[1]], p = c && c.items[+parts[2]]; if (!p) return null;
    return `<div class="it">${esc(p[0])}</div>
      <div class="big">${esc(p[1])}</div>
      <div class="pr">🗣️ ${esc(p[2])}</div>
      <div class="en">🇬🇧 ${esc(p[3])}</div>
      <div class="spacer"></div>
      <button class="btn solid" data-speak="${esc(p[1])}">🔊 Ascolta in francese</button>`;
  }
  if (parts[0] === "h") {
    const h = HOTELS[parts[1]]; if (!h) return null;
    const fr = "Bonjour ! Emmenez-nous à cette adresse, s'il vous plaît :";
    return `<div class="big" style="font-size:26px">${fr}</div>
      <div class="addr">${esc(h.name)}<br>${esc(h.street)}<br>${esc(h.city)}</div>
      <div class="en">🇬🇧 Please take us to this address.</div>
      <div class="it">Tel. hotel: ${esc(h.telShow)}</div>
      <div class="spacer"></div>
      <button class="btn solid" data-speak="${esc(fr + " " + h.name + ", " + h.street + ", " + h.city)}">🔊 Leggi al tassista</button>`;
  }
  if (parts[0] === "aiuto") {
    const m = myData(), cs = contacts(), h = HOTELS.paris;
    return `<div class="big" style="color:var(--red)">J'ai besoin d'aide.</div>
      <div class="en" style="color:var(--ink)">Je suis italien(ne), je ne parle pas français.<br>Appelez ce numéro, s'il vous plaît :</div>
      <div class="pr" style="font-style:normal">🇬🇧 I need help. I'm Italian, I don't speak French. Please call this number:</div>
      ${cs.length ? cs.map(c => `<a class="call" href="${telHref(c.tel)}"><span class="num">📞</span><span><b>${esc(c.name)}</b><small style="font-size:22px">${esc(c.tel)}</small></span></a>`).join("")
        : `<div class="card amber">Nessun contatto salvato in «I miei dati».</div>`}
      <div class="card"><b>Hôtel :</b> ${esc(h.name)}, ${esc(h.street)}, ${esc(h.city)} · ${esc(h.telShow)}</div>
      ${m.meds ? `<div class="card"><b>Médicaments / Medicines:</b><br>${esc(m.meds)}</div>` : ""}
      ${m.allerg ? `<div class="card red"><b>Allergies / Maladies:</b><br>${esc(m.allerg)}</div>` : ""}
      <div class="spacer"></div>
      <button class="btn solid" data-speak="J'ai besoin d'aide. Je suis italien, je ne parle pas français. Appelez ce numéro, s'il vous plaît.">🔊 Leggi ad alta voce</button>`;
  }
  return null;
}

/* ---------- Router ---------- */
const stack = [];
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  if (stack[stack.length - 2] === hash) stack.pop(); else if (stack[stack.length - 1] !== hash) stack.push(hash);
  const parts = hash.split("/").filter(Boolean);
  const backBtn = document.getElementById("back");
  let v = null;

  if (parts[0] === "m") {
    const inner = showView(parts.slice(1));
    if (inner) {
      app.innerHTML = `<div class="show">${inner}<button class="btn" data-close>✕ Chiudi</button></div>`;
      window.scrollTo(0, 0);
      return;
    }
  } else if (parts[0] === "frasi" && parts[1] !== undefined) v = views.frasiCat(+parts[1]);
  else if (views[parts[0] || ""]) v = views[parts[0] || ""]();

  if (!v) { location.replace("#/"); return; }
  document.getElementById("title").textContent = v.title;
  backBtn.hidden = !parts.length;
  app.innerHTML = v.html;
  window.scrollTo(0, 0);
}
function goBack() { if (stack.length > 1) history.back(); else location.hash = "#/"; }
document.getElementById("back").addEventListener("click", goBack);

app.addEventListener("click", e => {
  const s = e.target.closest("[data-speak]"); if (s) { speak(s.dataset.speak); return; }
  if (e.target.closest("[data-close]")) goBack();
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pill) { const st = store.get("pills", {}); st[t.dataset.pill] = t.checked; store.set("pills", st); }
  if (t.dataset.before) { const st = store.get("before", {}); st[t.dataset.before] = t.checked; store.set("before", st); }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.me) { const m = myData(); m[t.dataset.me] = t.value.trim(); store.set("me", m); }
});
window.addEventListener("hashchange", route);
route();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
